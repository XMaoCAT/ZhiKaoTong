<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="ZhiKaoTong logo">
  <!-- 智考通 Logo：渐变圆角方 + 白色学士帽 + 对勾（education × attendance） -->
  <defs>
    <linearGradient id="zkt-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B8AF5"/>
      <stop offset="1" stop-color="#1558C7"/>
    </linearGradient>
    <linearGradient id="zkt-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="220" height="220" rx="56" fill="url(#zkt-g)"/>
  <rect x="10" y="10" width="220" height="104" rx="56" fill="url(#zkt-gloss)"/>
  <!-- 学士帽（24×24 图标坐标系 ×6 缩放：帽面/帽身） -->
  <g transform="translate(48,44) scale(6)" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 10v6M2 10l10-5 10 5-10 5-2-1"/>
    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
  </g>
  <!-- 帽穗 -->
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="#FFFFFF">
    <line x1="181" y1="86" x2="181" y2="118"/>
    <circle cx="181" cy="124" r="5.5"/>
  </g>
  <!-- 底部对勾（考勤语义） -->
  <path d="M95 180 l16 16 36 -36" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
